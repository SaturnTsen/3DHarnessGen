[workspace]
channels = ["conda-forge"]
name = "3DHarnessGen"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
validate-trajectory = "python tools/validate_trajectory.py"
post-train = "python -m scripts.post_train"
post-train-hydra = "python -m harness_training.hydra_cli"
post-train-distributed = "torchrun --standalone --nnodes=1 --nproc-per-node=2 -m scripts.post_train"
test-post-training = "python -m pytest tests/harness_training"
type-check = "python -m pyright --pythonpath .pixi/envs/default/bin/python"
debug-audit = "debugpy --listen localhost:12888 --wait-for-client -m harness_training.cli audit"
debug-prepare = "debugpy --listen localhost:12888 --wait-for-client -m harness_training.cli prepare"
debug-preview = "debugpy --listen localhost:12888 --wait-for-client -m harness_training.cli preview"

[dependencies]
python = "3.12.*"
matplotlib = ">=3.11.2,<4"
numpy = "==2.5.3"

[pypi-dependencies]
vllm = "==0.30.0"
huggingface-hub = ">=1.32.0, <2"
trl = ">=1.13.0, <2"
pydantic-yaml = "==1.7.0"
peft = "==0.21.2"
3dharnessgen = { path = ".", editable = true }
hydra-core = ">=1.3.2, <1.4"
bitsandbytes = ">=0.49, <0.50"
wandb = ">=0.25, <0.26"
causal-conv1d = ">=1.7.0, <2"
flash-linear-attention = ">=0.6.0, <0.7"

[pypi-options]
# Build the CUDA extension against the project's locked PyTorch.
no-build-isolation = ["causal-conv1d"]

# Keep the existing NumPy version despite numba's older upper bound.
# This makes the user's existing compatibility exception explicit to Pixi.
[pypi-options.dependency-overrides]
numpy = "==2.5.3"

[feature.dev.pypi-dependencies]
debugpy = "*"
pytest = "==9.1.1"
pyright = ">=1.1.414, <2"

[feature.dev.dependencies]
ipykernel = ">=7.4.0,<8"
nodejs = ">=26.10.0,<26.11"

[environments]
default = ["dev"]
