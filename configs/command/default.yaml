# @package _global_
command:
  action: audit
  limit: 1
  split: train
  render_only: false
hydra:
  job:
    chdir: false
  run:
    dir: ${project_path:outputs/hydra}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${project_path:outputs/hydra_sweeps}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
