# Shared Qwen options; select qwen35_9b or qwen38_27b for model-specific settings.
adapter:
  adapter_name: default
  autocast_adapter_dtype: true
  low_cpu_mem_usage: false
  mixed: false
  revision: null
attention_implementation: sdpa
device_map: balanced
dtype: bfloat16
freeze_vision: true
local_files_only: true
lora:
  alpha: 32
  backend:
    alora_invocation_tokens: null
    alpha_pattern: {}
    arrow_config: null
    auto_mapping: null
    base_model_name_or_path: null
    corda_config: null
    ensure_weight_tying: false
    eva_config: null
    exclude_modules: null
    fan_in_fan_out: false
    inference_mode: false
    init_lora_weights: true
    kasa_config: null
    layer_replication: null
    layers_pattern: null
    layers_to_transform: null
    loftq_config: {}
    lora_bias: false
    lora_ga_config: null
    megatron_config: null
    megatron_core: megatron.core
    modules_to_save: null
    monteclora_config: null
    peft_type: LORA
    peft_version: null
    qalora_group_size: 16
    rank_pattern: {}
    revision: null
    runtime_config:
      ephemeral_gpu_offload: false
    target_parameters: null
    trainable_token_indices: null
    use_bdlora: null
    use_dora: false
    use_qalora: false
    use_rslora: false
    velora_config: null
  bias: none
  dropout: 0.05
  rank: 16
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  task_type: CAUSAL_LM
name: qwen
init_from: null
trust_remote_code: false
tuning: lora
use_cache: false
