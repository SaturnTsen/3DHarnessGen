data:
  accepted_statuses:
  - OK
  include_final_reply: true
  instances: null
  missing_images: skip_sample
  runs_root: ../3DHarnessBench/runs
  source_model: gpt-6-astra
  strip_plugin_recommendations: true
  test_fraction: 0.1
  validation_fraction: 0.1
  verify_images: true
experiment:
  name: sft_full_3d_interaction
  output_dir: ../outputs/post_training/Full3DInteraction/sft_v1
  scene: Full3DInteraction
  seed: 42
method:
  batch_size: 1
  dataloader_workers: 0
  epochs: 1.0
  eval_steps: 100
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 2e-05
  logging_steps: 10
  max_steps: -1
  name: sft
  resume_from: null
  save_steps: 100
  save_total_limit: 2
  use_cpu: false
  warmup_ratio: 0.03
  weight_decay: 0.01
model:
  attention_implementation: sdpa
  dtype: bfloat16
  freeze_vision: true
  lora:
    alpha: 32
    dropout: 0.05
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  name: qwen
  path: ~/models/Qwen3.8-27B
  tuning: lora
schema_version: 1
template:
  enable_thinking: false
  max_image_pixels: 262144
  max_length: 65536
  min_image_pixels: 65536
  name: qwen
  tools_path: tools/agent_runtime.json
