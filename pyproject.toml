[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bootstrap3d-post-training"
version = "0.1.0"
description = "Config-driven post-training on existing 3DHarnessBench trajectories"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-yaml>=1.6,<2",
  "Pillow>=11",
  "torch>=2.6",
  "transformers>=5.17,<6",
  "trl>=1.13,<2",
  "accelerate>=1.12,<2",
  "datasets>=4,<5",
  "peft>=0.17,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
post-train = "harness_training.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness_training*"]

[tool.pytest.ini_options]
testpaths = ["tests/harness_training"]
pythonpath = ["."]
